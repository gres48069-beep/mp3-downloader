<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل برنامج تحويل الفيديو إلى MP3</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 500px; width: 100%; border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-bottom: 15px; font-size: 26px; }
        p { color: #94a3b8; margin-bottom: 30px; font-size: 15px; line-height: 1.6; }
        .download-btn { display: inline-block; background-color: #0284c7; color: white; padding: 15px 35px; border-radius: 8px; text-decoration: none; font-size: 18px; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4); }
        .download-btn:hover { background-color: #0369a1; transform: translateY(-2px); }
        .footer { margin-top: 25px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎵 محول الفيديو إلى MP3 الذكي</h1>
        <p>أداة مجانية، خفيفة وسريعة لسطح المكتب تتيح لك تحميل مقاطع الفيديو والصوتيات وقوائم التشغيل (Playlists) من مختلف المنصات وتحويلها إلى صيغة MP3 بضغطة زر واحدة مع ميزة الالتقاط التلقائي للرابط.</p>
        
        <!-- استبدل رابط # برابط تحميل ملف الـ EXE المباشر الخاص بك -->
        <a href="#" class="download-btn">⬇️ تحميل البرنامج للويندوز (.exe)</a>
        
        <div class="footer">مجاني تماماً • آمن ولا يحتوي على إعلانات</div>
    </div>

</body>
</html>
